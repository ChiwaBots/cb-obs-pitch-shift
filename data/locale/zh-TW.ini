PitchShift="升降 key"
Semitones="升降 key (半音)"
SpreadCpu="攤平 CPU 負載 (CPU 較平穩，但延遲更高)"
Note="0 個半音 = 直接放行：完全不處理，不增加延遲。\n\n其他數值會讓聲音固定慢約 60 毫秒 (開「攤平 CPU 負載」則為 90 毫秒)。畫面不會跟著延遲，所以看起來會比聲音早一點。介意的話，對同一個來源再加一個「畫面延遲 (非同步)」濾鏡，設成一樣的數值。\n\n這是音訊濾鏡，只會處理有流經 OBS 的聲音。掛在瀏覽器來源（例如 YouTube 伴奏）時，要在來源設定裡開啟「使用 OBS 控制音訊（Control audio via OBS）」，否則升降 key 完全沒作用。小訣竅：只要那個來源出現在混音器裡，就代表聲音有進 OBS。"
DockTitle="升降 key"
DockTarget="目標來源"
DockNoTarget="(沒有升降 key 濾鏡)"
DockReset="歸零"
DockLower="降 1 個半音"
DockRaise="升 1 個半音"
DockNoAudio="此來源的聲音沒有經過 OBS，升降 key 不會生效。請在來源開啟「使用 OBS 控制音訊」（在音訊混音器右鍵該來源）。"
