Note="0 semitones = bypass: no processing, no added latency.\n\nAny other value adds a constant audio delay of about 60 ms (90 ms with 'spread CPU load' on). Video is not delayed, so the picture runs slightly ahead. If that bothers you, add a Render Delay filter to the same source and set it to match.\n\nThis is an audio filter, so it only affects audio that flows through OBS. For a Browser source (e.g. a YouTube accompaniment), enable 'Control audio via OBS' in the source properties, or the pitch shift does nothing. Tip: if the source appears in the Audio Mixer, its audio is going through OBS."
