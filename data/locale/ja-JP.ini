Note="0 半音 = バイパス：処理を行わず、遅延も増えません。\n\nそれ以外の値では音声が約 60 ミリ秒 (「CPU 負荷を平準化」オン時は 90 ミリ秒) 遅れます。映像は遅延しないため、画面のほうが少し先行します。気になる場合は同じソースに「映像の遅延 (非同期)」フィルタを追加し、同じ値を設定してください。\n\nこれは音声フィルタなので、OBS を通る音声にしか効きません。ブラウザソース（例：YouTube の伴奏）では、ソースのプロパティで「OBSで音声を制御する（Control audio via OBS）」を有効にしてください。無効だとキー変更は効きません。ヒント：そのソースが音声ミキサーに表示されていれば、音声は OBS を通っています。"
