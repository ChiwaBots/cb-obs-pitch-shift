Semitones="키 (반음)"
SpreadCpu="CPU 부하 분산 (CPU는 안정적이지만 지연이 늘어남)"
Note="0 반음 = 우회: 처리하지 않으며 지연도 추가되지 않습니다.\n\n다른 값을 쓰면 소리가 약 60밀리초 ('CPU 부하 분산' 사용 시 90밀리초) 일정하게 늦어집니다. 영상은 지연되지 않으므로 화면이 조금 앞서갑니다. 신경 쓰인다면 같은 소스에 '영상 지연 (비동기)' 필터를 추가하고 같은 값으로 맞추세요.\n\n이것은 오디오 필터이므로 OBS를 거치는 소리에만 적용됩니다. 브라우저 소스(예: YouTube 반주)에서는 소스 속성에서 'OBS로 오디오 제어(Control audio via OBS)'를 켜야 합니다. 켜지 않으면 키 조절이 전혀 적용되지 않습니다. 팁: 해당 소스가 오디오 믹서에 보이면 소리가 OBS를 거치는 것입니다."
DockTitle="키 조절"
DockTarget="대상 소스"
DockNoTarget="(키 조절 필터가 없습니다)"
DockReset="초기화"
DockLower="반음 1개 내리기"
DockRaise="반음 1개 올리기"
DockNoAudio="이 소스의 오디오가 OBS를 거치지 않아 키 조절이 적용되지 않습니다. 소스에서 'OBS로 오디오 제어'를 켜세요(오디오 믹서에서 우클릭)."
