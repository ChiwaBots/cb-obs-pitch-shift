PitchShift="升降 key"
Semitones="升降 key (半音)"
SpreadCpu="摊平 CPU 负载 (CPU 较平稳，但延迟更高)"
Note="0 个半音 = 直接放行：完全不处理，不增加延迟。\n\n其他数值会让声音固定慢约 60 毫秒 (开「摊平 CPU 负载」则为 90 毫秒)。画面不会跟着延迟，所以看起来会比声音早一点。介意的话，对同一个来源再加一个「画面延迟 (异步)」滤镜，设成一样的数值。\n\n这是音频滤镜，只会处理流经 OBS 的声音。挂在浏览器来源（例如 YouTube 伴奏）时，要在来源设置里开启「通过 OBS 控制音频（Control audio via OBS）」，否则升降 key 完全没作用。小技巧：只要该来源出现在混音器里，就代表声音有进 OBS。"
DockTitle="升降 key"
DockTarget="目标来源"
DockNoTarget="(没有升降 key 滤镜)"
DockReset="归零"
DockLower="降 1 个半音"
DockRaise="升 1 个半音"
DockNoAudio="此来源的声音没有经过 OBS，升降 key 不会生效。请在来源开启「通过 OBS 控制音频」（在音频混音器右键该来源）。"
