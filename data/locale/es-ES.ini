SpreadCpu="Repartir la carga de CPU (CPU más estable, pero MÁS latencia)"
Note="0 semitonos = sin efecto: no se procesa nada y no se añade latencia.\n\nCualquier otro valor retrasa el audio unos 60 ms de forma constante (90 ms con «repartir la carga de CPU» activado). El vídeo no se retrasa, así que la imagen va ligeramente por delante. Si te molesta, añade un filtro «Retraso de vídeo (asíncrono)» a la misma fuente con el mismo valor.\n\nEsto es un filtro de audio, así que solo afecta al audio que pasa por OBS. En una fuente de Navegador (p. ej. un acompañamiento de YouTube), activa «Controlar audio a través de OBS» (Control audio via OBS) en las propiedades de la fuente; de lo contrario, el cambio de tono no tiene efecto. Consejo: si la fuente aparece en el Mezclador de audio, su audio pasa por OBS."
